<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Jackpot Vault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de luz infinita — a câmera passeia sobre uma grade sem fim; tudo o mais flutua discreto por cima. */
:root{
  --bg:#0c0c0e;          /* a sala escura */
  --surface:#151518;     /* painéis flutuantes */
  --surface-2:#1d1d21;   /* campos, chips */
  --line:#2a2a30;        /* fios */
  --fg:#ededf0;          /* texto */
  --muted:#8d8d96;       /* texto secundário */
  --accent:#a8b0ff;      /* seleção, foco, resultado de busca */
  --accent-ink:#0c0c0e;
  --danger:#ff8a80;
  --f-ui:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
/* Pedido do Mestre no chat (10/11, v28): barras de rolagem no estilo da página — fio fino arredondado, sem setas e sem trilho cinza;
   acende em lilás ao passar o mouse. Chrome/Edge/Safari pelo ::-webkit-scrollbar; Firefox pelo scrollbar-color. */
::-webkit-scrollbar{width:10px;height:10px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background:#34343c;background-clip:padding-box;border:3px solid transparent;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background-color:#6b70a0}
::-webkit-scrollbar-thumb:active{background-color:var(--accent)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#34343c transparent}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Entrada (SSO simulado) ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
#login .backdrop{position:absolute;inset:0;overflow:hidden;opacity:.28;filter:saturate(.6)}
#login .backdrop .strip{display:flex;gap:12px;position:absolute;left:-10%;width:120%}
#login .backdrop img{width:140px;height:187px;border-radius:10px;object-fit:cover;flex:none}
#login .backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(12,12,14,.55) 0%,var(--bg) 70%)}
.card{position:relative;width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px 24px;display:grid;gap:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:18px}
.brand .mark{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.brand .mark i{background:var(--fg);border-radius:3px}
.brand .mark i:nth-child(2){background:var(--accent)}
.brand .mark i:nth-child(3){opacity:.45}
.card h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;border-radius:12px;font-weight:600;color:inherit;text-decoration:none;transition:transform .15s var(--ease),background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--fg);color:var(--bg)}
.btn-primary:hover{background:#fff}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn-ghost:hover{border-color:#3a3a42}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;outline:none}
.field input:focus{border-color:var(--accent)}
.err{color:var(--danger);font-size:13px;min-height:18px}
.sso-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.badge-sim{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);white-space:nowrap}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted);transition:color .2s}
.steps li .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.steps li.on{color:var(--fg)}
.steps li.on .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.ok{color:var(--fg)}
.steps li.ok .dot{border-color:var(--accent);background:var(--accent);animation:none}
.steps li.ok .dot::after{content:"";width:6px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent);color:var(--accent-ink);flex:none}

/* ---------- Grade infinita ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg)}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.tile{position:absolute;width:var(--cell);height:var(--cellh,var(--cell));border-radius:12px;overflow:hidden;background:var(--surface);
  transition:opacity .35s var(--ease),filter .35s var(--ease)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .4s}
.tile img.ld{opacity:1}
.tile img.alta{object-position:50% 18%}
.tile .cap{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:end;gap:6px;
  opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s var(--ease);pointer-events:none}
.tile .cap b{font-size:13px;background:rgba(12,12,14,.78);backdrop-filter:blur(6px);padding:4px 8px;border-radius:8px}
.tile .cap span{font-family:var(--f-mono);font-size:10px;background:rgba(12,12,14,.78);padding:4px 6px;border-radius:6px;color:#cfcfd6}
.tile.dim{opacity:.1;filter:grayscale(1)}
@media (hover:hover){#stage:not(.dragging) .tile:hover .cap{opacity:1;transform:none}}
.zoomed-out .tile .cap{display:none}

/* topo */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar .brand{height:48px;white-space:nowrap}
/* Rodada 12 · d4 (ajuste do Mestre): quem está logado numa cápsula legível sobre a grade, em qualquer largura.
   Rodada 15 · d3 (ajuste do Mestre: "o Sair está redundante, manter um só"): o "Sair" fica só no menu da conta; a cápsula (avatar, nome e ▾) abre o menu.
   No celular fica só o avatar. */
.who{justify-self:end;position:relative;display:flex;align-items:center;gap:2px;height:44px;margin-top:2px;padding:4px;border-radius:999px;background:rgba(21,21,24,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.who:empty{display:none}
.who .wbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 0;border-radius:999px;min-width:0;color:var(--fg)}
.who .wbtn .wseta{flex:none;color:var(--muted);transition:transform .15s}
.who .wbtn[aria-expanded="true"] .wseta{transform:rotate(180deg)}
.who .wbtn:hover{background:var(--surface-2)}
.who .avatar{width:34px;height:34px;font-size:13px}
.who .wnome{font-size:14px;font-weight:500;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.wmenu{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.wmenu[hidden]{display:none}
/* Rodada 14 · d4 (B com ajuste do Mestre: "na barra do topo, em layout próximo ao do item C"): os avisos da leitura do Drive ficam numa cápsula
   laranja ao lado da conta, no Início; ela abre um painel no mesmo estilo do menu da conta. Só aparece quando há aviso. */
.topdir{justify-self:end;display:flex;align-items:flex-start;gap:8px;min-width:0}
.avs{position:relative}
.avs:empty{display:none}
.avbtn{display:flex;align-items:center;gap:8px;height:44px;margin-top:2px;padding:0 14px 0 12px;border-radius:999px;background:rgba(21,21,24,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,#f0a352 45%,var(--line));box-shadow:0 10px 30px rgba(0,0,0,.35);color:#f0a352;font-size:14px;font-weight:500;white-space:nowrap}
.avbtn:hover,.avbtn[aria-expanded="true"]{border-color:#f0a352}
.avbtn svg{flex:none}
.avmenu{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.avmenu[hidden]{display:none}
.avmenu>div{display:grid;gap:4px;min-width:0}
.avmenu b{font-weight:600}
.avmenu .mono{color:var(--muted)}
.avmenu h4{margin:0;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.avmenu ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.avmenu li{position:relative;padding-left:14px;font-size:13px;line-height:1.4}
.avmenu li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:#f0a352}
.avmenu li .mono{display:block;font-size:11px;word-break:break-word}
.avmenu .avnota{margin:0;font-size:12px;color:var(--muted)}
.avmenu .plink{font-size:14px;justify-self:start}
.wmenu b{display:block;font-weight:600}
.wmenu .mono{display:block;color:var(--muted);word-break:break-all}
.wmenu .btn{height:40px;font-size:14px}
/* Rodada 16 · d1 C + d2 B: o menu da conta ganhou duas linhas acima do "Sair": "Como organizar o Drive ›" (abre o painel das regras, no mesmo
   estilo do menu, com pontos lilás de regra — não laranja de aviso) e "Ler a planilha de novo ↻" com a hora da última leitura em letra de código. */
.wmenu .wsep{height:1px;background:var(--line)}
.witem{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;min-height:40px;margin:0 -6px;padding:6px 10px;border-radius:10px;font-size:14px;line-height:1.3;color:var(--fg);text-align:left}
.witem:hover,.witem:focus-visible{background:var(--surface-2)}
.witem small{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.witem .wseta2{color:var(--muted)}
.regmenu{width:min(400px,calc(100vw - 32px));gap:12px}
.regmenu ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.regmenu li{position:relative;padding-left:14px;font-size:13px;line-height:1.45}
.regmenu li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.regmenu .mono{word-break:normal}
.regmenu li .mono{display:inline;font-size:11.5px}
.regmenu .wvolta{justify-self:start;color:var(--accent);font-size:14px}
.search{position:relative}
.search .box{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;border-radius:999px;background:rgba(21,21,24,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:border-color .2s,border-radius .2s}
.search.open .box{border-radius:24px 24px 0 0;border-bottom-color:transparent}
.search .box:focus-within{border-color:#3d3d46}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:16px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.search .clear{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.search .clear:hover{background:var(--surface-2);color:var(--fg)}
.sugg{position:absolute;left:0;right:0;top:48px;background:rgba(21,21,24,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-top:0;border-radius:0 0 24px 24px;padding:6px 0 10px;
  max-height:min(60vh,420px);overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.sugg .sep{height:1px;background:var(--line);margin:0 16px 6px}
.sugg h6{margin:8px 16px 4px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sugg button{display:flex;width:100%;align-items:center;gap:12px;padding:8px 16px;text-align:left}
.sugg button[aria-selected="true"],.sugg button:hover{background:var(--surface-2)}
.sugg img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none}
.sugg .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.sugg small{color:var(--muted);display:block;font-size:12px}
.result-line{margin-top:8px;text-align:center;font-size:13px;color:var(--muted);text-shadow:0 1px 8px var(--bg)}
.result-line b{color:var(--fg)}

/* ---------- Provedoras no Início (pedido do Mestre 09/11 · Rodada 12: d1 B janela com os logos em grade, d2 B a busca principal também acha provedora) ---------- */
.provrow{display:flex;justify-content:center;margin-top:10px}
.provbtn{display:inline-flex;align-items:center;gap:10px;height:40px;max-width:100%;padding:0 14px 0 12px;border-radius:999px;background:rgba(21,21,24,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:14px;color:var(--fg)}
.provbtn:hover{border-color:#3d3d46}
.provbtn .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.provbtn .v{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.provbtn .car{color:var(--muted);flex:none}
.provbtn.on{border-color:var(--accent);padding-right:6px}
.provbtn .x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.provbtn .x:hover{background:var(--surface-2);color:var(--fg)}
.plogo{display:block;flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.pmono{display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;border:1.5px solid currentColor;border-radius:7px;line-height:1}
.provwrap{position:relative;display:flex;justify-content:center;max-width:100%}
.pq{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.pq:focus-within{border-color:#3d3d46}
.pq input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:15px;color:var(--fg)}
.pq input::placeholder{color:var(--muted)}
.pnota{margin:2px 6px 0;font-size:12px;color:var(--muted)}
.pnota b{color:var(--fg);font-weight:500}
.janela .caixa.pcaixa{width:min(880px,100%);gap:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;max-height:min(460px,56vh);overflow:auto;padding:2px;overscroll-behavior:contain}
.pcard{display:grid;grid-template-rows:56px auto auto;justify-items:center;align-content:center;gap:4px;padding:14px 10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);color:#d6d6dc;text-align:center;min-height:126px}
.pcard:hover,.pcard[aria-selected="true"]{border-color:#4a4a55;background:#222227;color:var(--fg)}
.pcard .plogo{width:min(118px,100%);height:44px;align-self:center}
.pcard b{font-size:13px;font-weight:500;color:var(--fg)}
.pcard small{font-size:11px;color:var(--muted)}
.pcard.zero{opacity:.62}
.pcard.atual{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pvazio{padding:18px 6px;text-align:center;color:var(--muted);font-size:13px}
.sugg .ic .plogo{width:28px;height:18px;color:#d6d6dc}
.sugg .ic .pmono{width:26px;height:20px;font-size:9px;color:#d6d6dc}
#app:not(.home) .provrow,body.prov-aberto .zoomctl{display:none}
@media (max-width:760px){
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));max-height:58vh}.pcard{min-height:110px;padding:10px 6px}.pcard .plogo{height:36px}
}
/* Rodada 8 · d3 B: "Lido do Drive há 5 min · Ler de novo ↻" entre os dados da página do personagem */
.fact .plink{font-size:inherit;word-break:normal}
/* Rodada 9 · d2 B: ao tocar em "Ler de novo", o próprio texto vira "Lendo o Drive…" com um giro (só rotação) e depois "agora mesmo" */
.fact .gira,.witem .gira{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:50%;border:1.5px solid var(--accent);border-top-color:transparent;vertical-align:-1px;animation:spin .8s linear infinite}

.chips-q{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chips-q .chip{height:32px;font-size:13px;background:rgba(21,21,24,.86);backdrop-filter:blur(10px)}
.chips-q .chip[aria-pressed="true"]{background:var(--fg)}
#stage.always .tile .cap{opacity:1;transform:none}
#app.home .search{position:fixed;left:50%;top:42%;transform:translate(-50%,-30px);width:min(640px,calc(100vw - 32px))}
#app.home .search .box{height:60px}
.halo{position:fixed;left:50%;top:42%;width:min(1180px,170vw);height:420px;transform:translate(-50%,-50%);z-index:10;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);
  background:radial-gradient(closest-side,rgba(12,12,14,.96) 0%,rgba(12,12,14,.86) 40%,rgba(12,12,14,.4) 75%,rgba(12,12,14,0) 100%);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
#app.home .halo{opacity:1}
.vignette{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);background:radial-gradient(ellipse at center,transparent 40%,rgba(12,12,14,.55) 100%)}
#app.home .vignette{opacity:1}
.matrix{display:grid;grid-template-columns:140px repeat(var(--cols),minmax(0,1fr));gap:12px;align-items:start}
.matrix h3{margin:0;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.matrix h2{margin:0;font-size:17px;padding-top:8px}
.cellm{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cellm .none{color:var(--muted);padding:12px}
/* ---- volume ---- */
.gallery{--min:200px;grid-template-columns:repeat(auto-fill,minmax(min(var(--min),100%),1fr))}
.gallery.d-P{--min:96px;gap:8px}.gallery.d-M{--min:150px}.gallery.d-G{--min:240px}
.gallery.folha{--min:92px;gap:6px}
.gallery.folha .shot{border-radius:8px}
.gallery.folha .shot .tag{display:none}
.shot .num{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-family:var(--f-mono);font-size:10px;color:#cfcfd6;background:linear-gradient(transparent,rgba(12,12,14,.85));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery.d-P .shot .tag{display:none}
.mock-badge{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:999px;padding:3px 8px}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:-12px 0 20px}
.etabs+.tools,.drill+.tools{margin-top:12px}
.tools .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:auto}
.dens{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.dens button{height:30px;min-width:34px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.dens button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.inq{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;min-width:0;width:min(280px,100%);outline:none}
.inq:focus{border-color:var(--accent)}
.sel{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;color:var(--fg)}
.more{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 0;color:var(--muted);font-size:13px}
.pager{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:24px 0}
.pager button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-family:var(--f-mono);font-size:13px}
.pager button[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Rodada 2: busca + tamanho na barra de filtros */
.fbusca{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:nowrap;min-width:0}
/* Rodada 3 · d1 B: o resumo rola para o lado com a coluna dos estilos fixa. Rodada 5 · d7 B: cada coluna tem sempre 150 px (84 px no celular), com uma ou dez empresas */
.pscroll{position:relative;overflow-x:auto;padding-bottom:10px;overscroll-behavior-x:contain}
.pscroll .pilhas{grid-template-columns:150px repeat(var(--cols),150px);width:max-content}
.pscroll .pl{position:sticky;left:0;z-index:2;background:var(--bg);align-self:stretch;display:flex;align-items:center;padding-right:8px}
/* Pedido do Mestre (10/11): o resumo rola arrastando com o mouse e esmaece nas bordas onde ainda há colunas escondidas (direita e, depois de rolar, junto da coluna dos estilos) */
.pfade{position:relative;--pfl:150px}
.pfade::before,.pfade::after{content:"";position:absolute;top:0;bottom:10px;width:56px;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s}
.pfade::before{left:var(--pfl);background:linear-gradient(90deg,var(--bg),rgba(12,12,14,0))}
.pfade::after{right:0;background:linear-gradient(270deg,var(--bg),rgba(12,12,14,0))}
.pfade.fl::before,.pfade.fr::after{opacity:1}
.pscroll.pode{cursor:grab}
.pscroll.puxando{cursor:grabbing;user-select:none;-webkit-user-select:none}
.pscroll.puxando .pilha{pointer-events:none}
.pscroll img{-webkit-user-drag:none;user-select:none}
/* Rodada 3 · d3 B: célula que nunca terá imagem (cinza) × imagem que falta produzir (laranja) */
.pilha.vazia span{font-size:12px;text-align:center;padding:6px;line-height:1.3}
.pilha.vazia.falta{border-color:color-mix(in srgb,#f0a352 50%,transparent);color:#f0a352}
/* Painel de prévia da rodada aberta (em cada personagem) */
.prevr{margin-top:18px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;display:grid;gap:8px}
.prevr p{margin:0;font-size:13px;color:var(--muted)}.prevr p b{color:var(--fg)}
.prevr .seg{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.prevr .seg>span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:84px}
.prevr .seg button{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.prevr .seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Rodada 4 · d3 C: colunas na ordem da planilha de empresas + aviso discreto de linha sem link */
.fonte-pl{margin:10px 0 0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fonte-pl b{color:var(--fg);font-weight:500}
.fonte-pl .pl-real b{color:var(--fg);font-weight:500}
/* Rodada 13 · d3 B: personagem sem capa nos Originais mostra um quadro escuro com as iniciais e "Sem capa" (some quando a capa chegar) */
.cover{position:relative}
.scapa{position:absolute;inset:0;display:grid;border-radius:inherit;overflow:hidden}
.scapa.ini{place-content:center;justify-items:center;gap:6px;background:radial-gradient(circle at 50% 38%,#202026,#121214 70%);box-shadow:inset 0 0 0 1px #33333a;color:var(--muted)}
.scapa.ini b{font-size:56px;line-height:1;letter-spacing:-.03em;color:#d6d6dc;font-weight:600}
.scapa.ini span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.sugg .sini{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 38%,#202026,#121214 70%);box-shadow:inset 0 0 0 1px #33333a;color:#d6d6dc;font-size:13px;font-weight:600;letter-spacing:-.02em}
.fact.falta-capa{color:#f0a352;border-color:color-mix(in srgb,#f0a352 45%,transparent)}
.fonte-pl .falta-link{color:#f0a352}
/* Rodada 5 · d6 C: filtros em menus compactos (Estilo ▾ · Origens ▾) */
/* Rodada 6 · d3 B: link "Abrir a planilha ↗" no lilás do destaque */
.plink{color:var(--accent);font-size:inherit;text-align:left;text-decoration:underline;text-underline-offset:3px;word-break:break-all}
/* Rodada 7 · d1 B: nomes repetidos avisados na janela do download, no laranja de "Falta produzir" */
.rep{margin:0;font-size:13px;color:#f0a352}
.arvore li.rep b{color:#f0a352}
.marca-nota{margin:12px 0 0!important;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters.f3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.menu{position:relative}
.mbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.mbtn b{color:var(--fg);font-weight:500}
.mbtn[aria-expanded="true"]{border-color:var(--fg)}
.pop{position:absolute;left:0;top:42px;z-index:8;min-width:240px;max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 40px rgba(0,0,0,.45);display:grid}
.pop button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;text-align:left}
.pop button:hover{background:var(--surface-2)}
.pop button .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pop .mk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.pop .mk.q{border-radius:4px}
.pop [aria-checked="true"] .mk{border-color:var(--accent);background:var(--accent)}
.pop [aria-checked="true"] .mk::after{content:"";width:5px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pop .psep{height:1px;background:var(--line);margin:4px 6px}
/* janela do download (Rodada 5 · d2 C: .zip sem pastas) */
.janela{position:fixed;inset:0;z-index:48;display:grid;place-items:center;background:rgba(8,8,10,.72);padding:16px}
.janela .caixa{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.janela .caixa>*{min-width:0}
.janela h3{margin:0;font-size:20px;letter-spacing:-.01em}
.janela .sub{margin:0;font-size:13px;color:var(--muted)}
.arvore{margin:0;padding:12px 14px;list-style:none;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-family:var(--f-mono);font-size:12px;line-height:1.7;color:var(--muted);max-height:260px;overflow:auto}
.arvore li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arvore li b{color:var(--fg);font-weight:500}
.progresso{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progresso i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.janela .acoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.janela .acoes .btn{height:42px;padding:0 18px;font-size:14px}
/* Rodada 3 · selecionar e baixar */
.shotw{position:relative;min-width:0}
.shotw .shot{width:100%}
/* Rodada 8 · d2 C: caixa de marcar também na imagem ampliada, no canto de cima à esquerda */
.vimg .ck.vck{left:24px;right:auto;top:24px;width:40px;height:40px;border-radius:10px;opacity:1}
.vimg .ck.vck.on{background:var(--accent);border-color:var(--accent);color:#0c0c0e}
.ck{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;border:1.5px solid rgba(255,255,255,.75);background:rgba(12,12,14,.55);color:transparent;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s;z-index:1}
.shotw:hover .ck,.ck:focus-visible,.marcando .ck,.shotw.on .ck{opacity:1}
@media (hover:none){.ck{opacity:1}}
.shotw.on .ck{background:var(--accent);border-color:var(--accent);color:#0c0c0e}
.shotw.on .shot{outline:2px solid var(--accent);outline-offset:2px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:calc(100% - 32px);flex-wrap:wrap;font-size:14px}
.selbar .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.marcando .pwrap{padding-bottom:110px}
.tem-sel .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
/* pilhas: resumo estilo × origem */
.pilhas{display:grid;grid-template-columns:150px repeat(var(--cols),minmax(0,1fr));gap:12px;align-items:stretch}
.pilhas h3{margin:0;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line);align-self:end}
.pilhas h2{margin:0;font-size:17px;align-self:center}
.pilha{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .2s,transform .2s var(--ease)}
.pilha:hover{border-color:#3a3a42;transform:translateY(-2px)}
.pilha img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--surface-2)}
.pilha.alta img{aspect-ratio:3/4;object-position:50% 15%}
.pilha .qt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 0;font-size:13px}
.pilha .qt b{font-size:18px;font-variant-numeric:tabular-nums}
.pilha .qt span{color:var(--muted);font-size:12px}
.pilha.vazia{display:grid;grid-template-columns:1fr;place-items:center;color:var(--muted);background:transparent;border-style:dashed;min-height:120px}
.pilha.vazia:hover{transform:none;border-color:var(--line)}
.drill{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.drill h2{margin:0;font-size:22px}
/* abas por estilo + origens com título fixo */
.etabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:8px;overflow-x:auto}
.etab{height:46px;padding:0 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.etab[aria-selected="true"]{color:var(--fg);border-color:var(--fg)}
.etab .n{font-family:var(--f-mono);font-size:11px;margin-left:6px;opacity:.7}
.osec{margin-bottom:28px}
.osec h3{position:sticky;top:64px;z-index:3;margin:0 0 10px;padding:10px 0;background:var(--bg);font-size:15px;display:flex;gap:10px;align-items:baseline}
.osec h3 .mono{color:var(--muted)}
/* filtros laterais */
.lado{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.facetas{position:sticky;top:72px;display:grid;gap:20px}
.facetas h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.facetas button{display:flex;justify-content:space-between;width:100%;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:14px}
.facetas button:hover{background:var(--surface-2);color:var(--fg)}
.facetas button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.facetas button .n{font-family:var(--f-mono);font-size:12px}
/* controles de zoom */
.zoomctl{position:fixed;z-index:20;left:max(16px,calc(16px + env(safe-area-inset-left,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;
  background:rgba(21,21,24,.86);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:4px}
.zoomctl button{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.zoomctl button:hover{background:var(--surface-2);color:var(--fg)}
.zoomctl output{min-width:52px;text-align:center}
.hint{position:fixed;z-index:20;right:max(16px,calc(16px + env(safe-area-inset-right,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12px;
  display:flex;gap:14px;background:rgba(21,21,24,.7);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.hint b{color:var(--fg);font-weight:500}
/* mira central: mostra o ponto de zoom */
.reticle{position:fixed;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;z-index:15;pointer-events:none;opacity:0;transition:opacity .3s}
.reticle.show{opacity:.9}
.reticle::before,.reticle::after{content:"";position:absolute;background:var(--fg)}
.reticle::before{left:13px;top:0;width:2px;height:28px}
.reticle::after{top:13px;left:0;height:2px;width:28px}

/* ---------- Página do personagem ---------- */
#page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;overscroll-behavior:contain}
#page[hidden]{display:none}
.pwrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
.pnav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding-block:12px;background:linear-gradient(var(--bg) 70%,transparent)}
.back{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:500}
.back:hover{border-color:#3a3a42}
.phead{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:32px;align-items:end;margin:16px 0 28px}
.cover{aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--surface);max-width:100%}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.phead h1{font-size:clamp(40px,7vw,84px);line-height:.95;letter-spacing:-.035em;margin:0 0 12px;font-weight:700}
.phead p{margin:0 0 18px;color:var(--muted);max-width:56ch}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted)}
.fact b{color:var(--fg);font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:28px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--fg);border-color:#3a3a42}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7}
.section{margin-bottom:40px}
.section h2{display:flex;align-items:baseline;gap:12px;font-size:22px;letter-spacing:-.01em;margin:0 0 14px}
.section h2 .mono{color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--min,200px),100%),1fr));gap:12px}
.shot{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface);max-width:100%;transition:transform .25s var(--ease)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .tag{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(12,12,14,.8);padding:4px 7px;border-radius:6px}
.shot:hover{transform:translateY(-2px)}
.empty{padding:48px 0;color:var(--muted);text-align:center}

/* visualizador */
#viewer{position:fixed;inset:0;z-index:40;background:rgba(8,8,10,.94);display:grid;grid-template-columns:minmax(0,1fr) 320px}
#viewer[hidden]{display:none}
.vimg{position:relative;display:grid;place-items:center;padding:24px;min-height:0}
.vimg img{max-width:100%;max-height:calc(100vh - 48px);border-radius:12px;object-fit:contain}
.varrow{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.varrow.prev{left:16px}.varrow.next{right:16px}
.vside{background:var(--surface);border-left:1px solid var(--line);padding:76px 24px 24px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.vside>*{flex-shrink:0}
.vside h3{margin:0;font-size:20px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:13px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;word-break:break-all}
/* Rodada 7 · d4 (ajuste): "Fechar" com texto, sempre no canto de cima à direita da imagem ampliada (no celular, sobre a imagem) */
.vclose{position:absolute;z-index:2;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface-2);border:1px solid #3a3a42;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.vclose:hover{border-color:var(--fg)}
.vside .btn{height:44px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;width:max-content;max-width:calc(100% - 32px)}
/* Rodada 9 · d1 B com ajuste: fita com as miniaturas do conjunto embaixo da imagem ampliada; só imagens do mesmo estilo (não mistura 3D e Realista) */
.vfita{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 4px 8px;width:100%;max-width:100%;justify-content:safe center}
.vfita .fi{position:relative;flex:none}
.vfita [data-vk]{display:block;width:56px;height:56px;border-radius:8px;overflow:hidden;opacity:.5;transition:opacity .15s}
.vfita [data-vk] img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.vfita [data-vk]:hover{opacity:.85}
.vfita [data-vk][aria-current]{opacity:1;outline:2px solid var(--accent);outline-offset:-2px}
#viewer.com-fita .vimg{grid-template-rows:minmax(0,1fr) auto;gap:12px}
#viewer.com-fita .vimg img{max-height:calc(100vh - 48px - 84px)}

/* ================= PROVEDORAS (pedido do Mestre 09/11) =================
   Filtro por provedora no Início. A Rodada 12 decide o jeito de escolher (d1: "lista" suspensa ou "grade" = janela com os logos)
   e se a busca principal também acha provedoras (d2). As duas formas aceitam nome escrito errado (busca "parecida").
   A provedora de cada personagem é simulada no build (ainda não há de onde ler). */
// Rodada 12 (fixos no código, v21): d1 B janela com os logos em grade (com o ajuste: filtrar só esconde o que não atende, sem contorno nos resultados)
//   · d2 B a busca principal também acha provedora · d3 B (com ajuste) a provedora virá da pasta da provedora no Drive e o logo, da raiz dela nos Originais (build.py)
// Rodada 13 · d3 B: personagem sem capa nos Originais = quadro com as iniciais e "Sem capa" (grade, busca e página). A 1ª imagem fica
// guardada como "capa" só para o lugar dele na grade (build.py); quando a capa chegar nos Originais, o quadro some sozinho.
const iniciais=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function semCapaHTML(slug){const c=charBy[slug];return `<div class="scapa ini" aria-hidden="true"><b>${esc(iniciais(c.nome))}</b><span>Sem capa</span></div>`;}
const PROVS=ACERVO.provedoras||[];const provBy=Object.fromEntries(PROVS.map(p=>[p.id,p]));
// selo da janela de provedoras: diz o que ainda é simulado (provedora dos 13 exemplos; logos que não vieram do Drive)
const provSimTxt=()=>{const sp=CHARS.some(c=>c.provSim),sl=PROVS.some(p=>p.logoSim);
  return sp&&sl?"Provedoras e logos simulados":sp?"Logos lidos do Drive · provedora dos exemplos simulada":sl?"Provedoras lidas do Drive · logos simulados":"Lido do Drive";};
const provN=id=>CHARS.filter(c=>c.prov===id).length;
let PROVF=null;
const nk=s=>norm(s).replace(/[^a-z0-9]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[m][n];}
// nota de 0 a 100: começo do nome > meio do nome > parecido (até 1 erro em 4–5 letras, 2 erros em 6+)
function provNota(q,p){const a=nk(q);if(!a)return 0;let best=0;
  for(const nome of [p.nome,...(p.apelidos||[])]){const n=nk(nome);if(!n)continue;let sc=0;
    if(n.startsWith(a))sc=100;else if(n.includes(a))sc=85;
    else{const tol=a.length<4?0:a.length<6?1:2;if(tol){const pal=norm(nome).split(/[^a-z0-9]+/).filter(Boolean).map(nk);
        const d=Math.min(lev(a,n),lev(a,n.slice(0,a.length)),lev(a,n.slice(0,a.length+1)),lev(a,n.slice(0,Math.max(1,a.length-1))),...pal.map(w=>lev(a,w)));
        if(d<=tol)sc=60-d*10;}}
    best=Math.max(best,sc);}
  return best;}
function provBusca(q){const t=nk(q);const lista=PROVS.map(p=>({p,n:provN(p.id),sc:t?provNota(q,p):1})).filter(x=>x.sc>0);
  lista.sort((a,b)=>b.sc-a.sc||b.n-a.n||b.p.jogos-a.p.jogos);return{lista,aprox:!!t&&lista.length>0&&lista.every(x=>x.sc<85)};}
const sigla=p=>{if(p.sigla)return p.sigla;const w=p.nome.replace(/[^A-Za-z0-9' ]/g," ").split(/\s+/).filter(Boolean);return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase();};

const Search=(()=>{

    const m=new Set(IMGS.filter(im=>(!pf||charBy[im.char].prov===pf)&&t.every(w=>im.hay.includes(w))).map(im=>im.i));
    // a home mostra só personagens: cada personagem com alguma imagem encontrada entra pela capa
    const cs=new Set(IMGS.filter(im=>m.has(im.i)).map(im=>im.char));IMGS.forEach(im=>{if(im.cat==="capa"&&cs.has(im.char))m.add(im.i);});
    const ni=IMGS.filter(im=>m.has(im.i)&&im.cat!=="capa").length;Grid.setMatch(m);

      :pf&&!t.length?`Nenhum personagem da <b>${pn}</b> ainda.`:`Nada encontrado para “${esc(v)}”${pf?` na <b>${pn}</b>`:""}. Tente um nome de personagem, “3D” ou “Empresa 1”.`;
    return m;}

/* ================= CESTA E DOWNLOAD ================= */
// Rodada 3 · d2 C: a cesta guarda a seleção entre personagens e baixa tudo junto (download simulado).
// Rodada 5 · d1 B: a mesma barra do rodapé aparece também no Início sempre que a cesta tiver imagens (no celular sobe acima do zoom).
// Rodada 5 · d2 C: o .zip vem sem pastas; o nome de cada arquivo diz de onde ele veio.
const Cesta=(()=>{
  const sel=new Map(); // i -> imagem
  const bar=el("div",{class:"selbar",id:"selbar","aria-live":"polite"});bar.hidden=true;document.body.appendChild(bar);
  const naPagina=()=>!$("#page").hidden;
  const muda=()=>{document.dispatchEvent(new Event("cesta"));atualiza();};
  const plural=(n,a,b)=>n===1?a:b;
  function atualiza(){const n=sel.size,pag=naPagina(),temas=new Set([...sel.values()].map(i=>i.char)).size;
    document.body.classList.toggle("na-grade",!pag);
    if(!n){bar.hidden=true;document.body.classList.remove("tem-sel");$("#page").classList.remove("marcando");return;}
    bar.innerHTML=`<span><b>${n}</b> ${plural(n,"imagem selecionada","imagens selecionadas")} · cesta com ${temas} ${plural(temas,"tema","temas")}</span><button class="chip" data-limpa>Esvaziar</button><button class="chip on" data-bsel>Baixar ${n}</button>`;
    bar.hidden=false;document.body.classList.add("tem-sel");$("#page").classList.toggle("marcando",pag);}
  // Rodada 6 · d4 B com ajuste: cada arquivo vai com o mesmo nome que tem no Drive (o BD-Visual não cria nomes).
  // Como o .zip não tem pastas, um nome que já apareceu ganha " (2)", " (3)"… no fim, como faz o computador ao salvar.
  function nomesZip(lista){const vistos=new Map();return lista.map(i=>{const k=norm(i.file),q=(vistos.get(k)||0)+1;vistos.set(k,q);
    return q===1?{nome:i.file,rep:false}:{nome:i.file.replace(/(\.[^.]+)?$/,m=>` (${q})${m}`),rep:true};});}
  // Rodada 7 · d1 B: a janela do download diz quantos nomes se repetem e marca esses nomes em laranja, com a dica de dar nomes diferentes no Drive
  // Rodada 9 · d3 A: depois de baixar, a cesta continua cheia (esvaziar é sempre pelo botão "Esvaziar" da barra)
  function baixar(lista){const n=lista.length;if(!n)return;
    const nome=`Jackpot-Vault_${new Date().toISOString().slice(0,10)}.zip`,nz=nomesZip(lista),nrep=nz.filter(x=>x.rep).length,avisa=nrep>0;
    const linhas=nz.slice(0,10).map(x=>`<li${avisa&&x.rep?' class="rep"':""}><b>${esc(x.nome)}</b></li>`);let extra=n-10;extra=extra>0?`<li>… e mais ${extra} ${plural(extra,"arquivo","arquivos")}</li>`:"";
    const w=el("div",{class:"janela",role:"dialog","aria-modal":"true","aria-label":"Baixar imagens"});
    w.innerHTML=`<div class="caixa"><div style="display:grid;gap:6px"><h3>Baixar ${n} ${plural(n,"imagem","imagens")}</h3><p class="sub">Um arquivo .zip com as imagens soltas, sem pastas; cada uma vai com o mesmo nome que tem no Drive.</p></div>
      ${avisa?`<p class="rep">${nrep} ${plural(nrep,"arquivo tem","arquivos têm")} o mesmo nome de outro da cesta e ${plural(nrep,"vai","vão")} com (2), (3)… no fim. Para evitar, dê nomes diferentes no Drive.</p>`:""}
      <ul class="arvore"><li><b>${nome}</b></li>${linhas.join("")}${extra}</ul>
      <div class="progresso" aria-hidden="true"><i></i></div>
      <div class="acoes"><span class="badge-sim" style="margin-right:auto">Simulação</span><button class="btn btn-ghost" data-cancela>Cancelar</button><button class="btn btn-primary" data-zip>Baixar .zip</button></div></div>`;
    document.body.appendChild(w);const fecha=()=>{w.remove();};
    w.querySelector("[data-cancela]").onclick=fecha;w.addEventListener("click",e=>{if(e.target===w)fecha();});
    w.querySelector("[data-zip]").onclick=e=>{e.currentTarget.disabled=true;const fim=()=>{fecha();toast(`Download simulado: ${nome} com ${n} ${plural(n,"imagem","imagens")}`);};
      if(RM)return fim();w.querySelector(".progresso i").animate([{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:900,easing:"ease-out",fill:"forwards"}).onfinish=fim;};
    w.querySelector("[data-zip]").focus({preventScroll:true});}
  document.addEventListener("click",e=>{const t=e.target.closest("[data-limpa],[data-bsel]");if(!t)return;
    if(t.matches("[data-limpa]")){sel.clear();muda();}else baixar([...sel.values()]);});
  addEventListener("keydown",e=>{if(e.key!=="Escape")return;const j=$(".janela:not(.pj)");if(j){e.stopImmediatePropagation();j.remove();}},true);
  return{sel,atualiza,baixar,muda,nomesZip};
})();

  function pilha(g,s,sm){const it=g.items.filter(i=>i.sub===s.id);

    const nc=it.filter(i=>sel.has(i.i)).length;
    const cesta=nc?`<span class="pselo" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M5 12l5 5 9-10"/></svg>${nc}</span>`:"";
    return `<button class="pilha${alta?" alta":""}" data-drill="${g.k.id}|${s.id}" aria-label="${esc(g.k.nome)}, ${esc(s.nome)}: ${it.length} imagens${nc?`, ${nc} na cesta`:""}">${it.slice(0,sm?1:4).map(i=>`<img src="${i.g}" alt="" loading="lazy">`).join("")}<span class="qt"><b>${it.length}</b><span>${it.length>4?"ver todas":"abrir"} ›</span></span>${cesta}</button>`;}
  function body(){const b=$("#pBody");if(!b)return;list=filtrada();
    if(!list.length){b.innerHTML=`<p class="empty">Nenhuma imagem com esse filtro${qIn?` e a busca “${esc(qIn)}”`:""}. Experimente limpar os filtros.</p>`;return;}
    const pc=charBy[cur]?.pastas||{},temPasta=id=>Object.values(pc).some(a=>a.includes(id));
    const groups=CATS.map(k=>({k,items:list.filter(i=>i.cat===k.id)})).filter(g=>g.items.length||(!qIn&&!drill&&(fCat==="all"||fCat===g.k.id)&&!g.k.oculta&&temPasta(g.k.id)));
    const subsUsadas=SUBS.filter(s=>list.some(i=>i.sub===s.id));
    let h="";
    if(!drill&&!qIn){
      // resumo estilo × empresa; as empresas escolhidas no menu Origens (Rodada 5 · d6 C) já filtram a lista; colunas sempre de 150 px (d7 B)
      const sm=innerWidth<760,cols=subsUsadas;
      h=ferramentas(`${list.length} imagens · ${cols.length} ${cols.length===1?"origem":"origens"}`)+
        `<div class="pfade"><div class="pscroll"><div class="pilhas" style="--cols:${cols.length}"><span class="pl"></span>${cols.map(s=>`<h3>${esc(s.nome)}</h3>`).join("")}${groups.map(g=>`<h2 class="pl">${esc(g.k.nome)}</h2>${cols.map(s=>pilha(g,s,sm)).join("")}`).join("")}</div></div></div>`+fontePl();
    }else if(drill&&!qIn){
      const [dc,ds]=drill.split("|"),it=list.filter(i=>i.cat===dc&&i.sub===ds);
      h=`<div class="drill"><button class="chip" data-voltar>‹ Resumo</button><h2>${esc(catBy[dc].nome)} · ${esc(subBy[ds].nome)}</h2></div>`+ferramentas(contagem(it),acoesConj(it))+galeria(it);
    }else h=ferramentas(`${list.length} ${list.length===1?"imagem encontrada":"imagens encontradas"}`)+groups.map(g=>`<section class="section"><h2>${esc(g.k.nome)} <span class="mono">${g.items.length}</span></h2>${galeria(g.items)}</section>`).join("");
    const sx=b.querySelector(".pscroll")?.scrollLeft||0;
    b.innerHTML=h;
    {const ps=b.querySelector(".pscroll");if(ps){ps.scrollLeft=sx;rolaResumo(ps);}}
    if(!RM&&anim)[...b.querySelectorAll(".shot,.pilha")].slice(0,16).forEach((s,k)=>s.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:300,delay:k*24,easing:"cubic-bezier(.2,.7,.1,1)",fill:"backwards"}));
    // Rodada 9 · d1 B com ajuste: a imagem ampliada recebe só as imagens do mesmo estilo (no conjunto aberto, também da mesma origem), para a fita não misturar 3D e Realista
    const conjuntoDe=im=>list.filter(i=>i.cat===im.cat&&(!(drill&&!qIn)||i.sub===im.sub));
    b.querySelectorAll(".shot").forEach(s=>s.onclick=()=>{const im=IMGS[+s.dataset.i];Viewer.open(conjuntoDe(im),im.i);});
    b.querySelectorAll("[data-drill]").forEach(x=>x.onclick=()=>{drill=x.dataset.drill;pag=1;tudo=false;body();barra();$("#pBody").scrollIntoView({block:"start",behavior:RM?"auto":"smooth"});});
    b.querySelector("[data-voltar]")?.addEventListener("click",()=>{drill=null;tudo=false;body();barra();});
    b.querySelectorAll("[data-pg]").forEach(x=>x.onclick=()=>{pag=+x.dataset.pg;body();$("#pBody").scrollIntoView({block:"start"});});
    b.querySelector("[data-tudo]")?.addEventListener("click",()=>{tudo=true;body();});
    b.querySelectorAll("[data-abrepl]").forEach(x=>x.onclick=abrePl);
    b.querySelector("button[data-pconj]")?.addEventListener("click",()=>{const [dc,ds]=drill.split("|");abrePasta(drivePath(list.find(i=>i.cat===dc&&i.sub===ds)));});
    b.querySelector("[data-paginas]")?.addEventListener("click",()=>{tudo=false;pag=1;body();$("#pBody").scrollIntoView({block:"start"});});
    b.querySelectorAll("[data-ck]").forEach(x=>x.onclick=e=>{e.stopPropagation();const i=+x.dataset.ck;if(sel.has(i))sel.delete(i);else sel.set(i,IMGS[i]);x.setAttribute("aria-checked",sel.has(i));x.parentElement.classList.toggle("on",sel.has(i));barra();const sa=b.querySelector("[data-selall]");if(sa){const [dc,ds]=drill.split("|");sa.textContent=list.filter(j=>j.cat===dc&&j.sub===ds).every(j=>sel.has(j.i))?"Desmarcar todas":"Selecionar todas";}});
    b.querySelector("[data-selall]")?.addEventListener("click",()=>{const [dc,ds]=drill.split("|"),it=list.filter(i=>i.cat===dc&&i.sub===ds);const todas=it.every(i=>sel.has(i.i));it.forEach(i=>todas?sel.delete(i.i):sel.set(i.i,i));re();barra();});
    b.querySelector("[data-bconj]")?.addEventListener("click",()=>{const [dc,ds]=drill.split("|");Cesta.baixar(list.filter(i=>i.cat===dc&&i.sub===ds));});
  }
  const barra=()=>Cesta.atualiza();
  function fly(from){const cover=$("#pCover");const to=cover.getBoundingClientRect();
    const f=el("div",{class:"flyer"});f.innerHTML=`<img src="${from.src}" alt="">`;Object.assign(f.style,{left:from.rect.left+"px",top:from.rect.top+"px",width:from.rect.width+"px",height:from.rect.height+"px"});
    document.body.appendChild(f);cover.style.opacity=0;
    const rest=[...page.querySelectorAll(".phead>div:last-child,.filters,#pBody,.pnav")];
    page.style.background="transparent";
    page.animate([{backgroundColor:"rgba(12,12,14,0)"},{backgroundColor:"rgba(12,12,14,1)"}],{duration:380,easing:"ease-out"}).onfinish=()=>{page.style.background="";};
    rest.forEach((r,k)=>r.animate([{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:380,delay:160+k*40,easing:"cubic-bezier(.2,.7,.1,1)",fill:"backwards"}));
    const a=f.animate([{left:from.rect.left+"px",top:from.rect.top+"px",width:from.rect.width+"px",height:from.rect.height+"px",borderRadius:"12px"},
      {left:to.left+"px",top:to.top+"px",width:to.width+"px",height:to.height+"px",borderRadius:"20px"}],{duration:520,easing:"cubic-bezier(.2,.7,.1,1)",fill:"forwards"});
    a.onfinish=()=>{cover.style.opacity="";f.remove();};}
  function hide(){Grid.hold("pagina",false);page.hidden=true;page.innerHTML="";cur=null;Cesta.atualiza();document.title="Jackpot Vault";if(OPT.transicao==="mergulho")Grid.reset();Grid.kick();$("#stage").focus({preventScroll:true});}
  return{open,show,hide,atual:()=>cur};
})();

/* ================= VISUALIZADOR ================= */
// Rodada 8 · d1 B: ao abrir, a imagem ampliada esmaece (fundo e imagem, 180–200 ms, só transparência e escala); ao fechar, o contrário. Com "reduzir movimento", de uma vez.
// Rodada 8 · d2 C: a caixa de marcar das miniaturas também fica no canto da imagem ampliada (põe e tira da cesta).
const Viewer=(()=>{
  const v=$("#viewer");let list=[],idx=0,prevFocus=null,fechando=false,hist=null;
  const EASE="cubic-bezier(.2,.7,.1,1)";
  function entra(){if(RM)return;v.animate([{opacity:0},{opacity:1}],{duration:180,easing:"ease-out"});
    v.querySelector(".vimg img")?.animate([{opacity:0,transform:"scale(.97)"},{opacity:1,transform:"none"}],{duration:200,easing:EASE});}
  function open(l,i){list=l;idx=Math.max(0,l.findIndex(x=>x.i===i));prevFocus=document.activeElement;fechando=false;draw();v.hidden=false;entra();centraFita();v.querySelector(".vclose").focus({preventScroll:true});marca();}
  // Rodada 11 · d3 B: abrir a imagem ampliada põe uma entrada no histórico (mesmo endereço); o Voltar do navegador ou do celular fecha só a imagem
  //   e você continua no conjunto. Fechar pelo botão (ou Esc) tira essa entrada, para o próximo Voltar ir ao Início.
  function marca(){hist=null;try{history.pushState({bdvImg:1},"",location.href);hist="push";}catch(e){hist=null;}}
  function desmarca(){const h=hist;hist=null;if(h==="push")history.back();}
  addEventListener("popstate",()=>{if(hist&&!v.hidden){hist=null;close();}});
  // Rodada 9 · d1 B com ajuste: fita de miniaturas embaixo da imagem (só o mesmo estilo, ver Page.conjuntoDe); a atual com borda lilás; toque numa para ir direto
  // Rodada 10 · d2 B: selo lilás com ✓ nas miniaturas que já estão na cesta (marcar continua pela caixa grande da imagem)
  const fitaHTML=()=>`<div class="vfita" role="group" aria-label="Imagens deste conjunto">${list.map((x,k)=>{const na=Cesta.sel.has(x.i);
    return `<span class="fi"><button data-vk="${k}" aria-label="${esc(x.file)}, ${k+1} de ${list.length}${na?", na cesta":""}"${k===idx?' aria-current="true"':""}><img src="${x.g}" alt="" loading="lazy" decoding="async"></button>${
      na?`<span class="selo" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M5 12l5 5 9-10"/></svg></span>`:""}</span>`;}).join("")}</div>`;
  function centraFita(){const f=v.querySelector(".vfita"),c=f&&f.querySelector("[aria-current]");if(!c)return;f.scrollLeft=c.parentElement.offsetLeft-f.clientWidth/2+c.offsetWidth/2;}
  // Rodada 10 · d1 B: ao trocar de imagem (setas, fita ou teclado) a nova esmaece em 140 ms, só transparência; com "reduzir movimento", de uma vez
  function troca(){if(RM)return;v.querySelector(".vimg>img")?.animate([{opacity:0},{opacity:1}],{duration:140,easing:"ease-out"});}
  function vai(k,dir){if(list.length<2)return;idx=(k+list.length)%list.length;draw();centraFita();troca();}
  // Rodada 11 · d1 B: arrastar a imagem para o lado troca de imagem (dedo ou mouse); a imagem acompanha (só posição e transparência);
  //   soltou depois de 60 px, entra a próxima (ou a anterior) esmaecendo; soltou antes, ela volta ao lugar. Fechar continua pelo botão "Fechar".
  function gesto(img){if(list.length<2)return;let p0=null,dx=0,eixo=null;img.draggable=false;
    img.addEventListener("pointerdown",e=>{if(e.button>0)return;p0={x:e.clientX,y:e.clientY,id:e.pointerId};dx=0;eixo=null;try{img.setPointerCapture(e.pointerId);}catch(_){}img.classList.add("pega");});
    img.addEventListener("pointermove",e=>{if(!p0||e.pointerId!==p0.id)return;dx=e.clientX-p0.x;const dy=e.clientY-p0.y;
      if(!eixo&&Math.hypot(dx,dy)>8)eixo=Math.abs(dx)>=Math.abs(dy)?"x":"y";
      if(eixo==="x"){img.style.transform=`translateX(${dx}px)`;img.style.opacity=Math.max(.35,1-Math.abs(dx)/500);}});
    const solta=e=>{if(!p0||e.pointerId!==p0.id)return;p0=null;img.classList.remove("pega");
      if(eixo==="x"&&Math.abs(dx)>60)return vai(idx+(dx<0?1:-1),dx<0?1:-1);
      volta(img);};
    img.addEventListener("pointerup",solta);img.addEventListener("pointercancel",solta);}
  function volta(img){const t=img.style.transform,o=img.style.opacity||1,vo=v.style.opacity;img.style.transform=img.style.opacity=v.style.opacity="";
    if(RM||!t)return;img.animate([{transform:t,opacity:o},{transform:"none",opacity:1}],{duration:180,easing:EASE});if(vo)v.animate([{opacity:vo},{opacity:1}],{duration:180,easing:EASE});}
  function draw(){const im=list[idx],c=charBy[im.char],fita=list.length>1;
    v.classList.toggle("com-fita",fita);v.classList.toggle("arrasta",fita);v.style.opacity="";
    v.innerHTML=`<div class="vimg"><img src="${im.f}" alt="${esc(c.nome)}, ${esc(catBy[im.cat].nome)}, ${esc(subBy[im.sub].nome)}">
      ${fita?fitaHTML():""}
      ${list.length>1?`<button class="varrow prev" aria-label="Anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><button class="varrow next" aria-label="Próxima"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>`:""}
      <button class="ck vck${Cesta.sel.has(im.i)?" on":""}" data-vck role="checkbox" aria-checked="${Cesta.sel.has(im.i)}" aria-label="Pôr ${esc(im.file)} na cesta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></button></div>
      <button class="vclose" aria-label="Fechar a imagem ampliada" title="Fechar (Esc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Fechar</button>
      <aside class="vside">
      <div><span class="mono" style="color:var(--muted)">${idx+1} de ${list.length}</span><h3>${esc(c.nome)} · ${esc(catBy[im.cat].nome)}</h3></div>
      <dl class="meta"><dt>Origem</dt><dd>${esc(subBy[im.sub].nome)}</dd><dt>Arquivo</dt><dd class="mono">${esc(im.file)}</dd><dt>Tamanho</dt><dd class="mono">${im.w} × ${im.h}px</dd><dt>Pasta</dt><dd class="mono">${esc(drivePath(im))}</dd><dt>Gerado em</dt><dd>${esc(im.fonte||"Magnific Spaces")}</dd></dl>
      ${botoesHTML(im)}</aside>`;
    v.querySelector("[data-vck]").onclick=()=>{if(Cesta.sel.has(im.i))Cesta.sel.delete(im.i);else Cesta.sel.set(im.i,im);Cesta.muda();draw();centraFita();v.querySelector("[data-vck]").focus({preventScroll:true});};
    v.querySelectorAll("[data-vk]").forEach(b=>b.onclick=()=>{const k=+b.dataset.vk;if(k===idx)return;vai(k,k>idx?1:-1);v.querySelector(`[data-vk="${idx}"]`)?.focus({preventScroll:true});});
    v.querySelector(".vclose").onclick=close;gesto(v.querySelector(".vimg>img"));
    v.querySelector(".prev")&&(v.querySelector(".prev").onclick=()=>vai(idx-1,-1));
    v.querySelector(".next")&&(v.querySelector(".next").onclick=()=>vai(idx+1,1));
    // Rodada 10 · d3 B: baixa só esta imagem, com o nome que tem no Drive, sem .zip e sem passar pela cesta (simulado)
    v.querySelector("[data-vbaixa]").onclick=()=>toast(`Download simulado: ${im.file} (só esta imagem, sem .zip)`);
    // Rodada 6 · d1 B: um botão só, que abre a pasta onde a imagem está (empresa › personagem › estilo).
    // Rodada 14 · d3 B: nas imagens lidas do Drive é um link de verdade (aba nova); nas de exemplo continua simulado
    if(!im.pastaId)v.querySelector("[data-dpasta]").onclick=()=>toast(`Simulação: abriria a pasta ${drivePath(im)} no Drive`);}
  // Rodada 10 · d3 B: o botão claro da lateral é "Baixar esta imagem"; embaixo, "Abrir a pasta no Drive"
  const PASTA=`Abrir a pasta no Drive <span class="badge-sim">Simulação</span>`;
  const pastaReal=im=>`<a class="btn btn-ghost" data-dpasta href="${esc((ACERVO.drivePasta||"https://drive.google.com/drive/folders/")+im.pastaId)}" target="_blank" rel="noopener" title="Abre a pasta no Google Drive numa aba nova (só para quem tem acesso)">Abrir a pasta no Drive ↗</a>`;
  const botoesHTML=im=>`<button class="btn btn-primary" data-vbaixa><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Baixar esta imagem</button>`+
    (im.pastaId?pastaReal(im):`<button class="btn btn-ghost" data-dpasta>${PASTA}</button>`);
  function some(){v.getAnimations().forEach(a=>a.cancel());v.hidden=true;v.innerHTML="";v.classList.remove("com-fita","arrasta");v.style.opacity="";fechando=false;prevFocus?.focus?.({preventScroll:true});}
  // ao fechar, parte de onde a imagem estiver
  function close(){if(v.hidden||fechando)return;desmarca();if(RM)return some();fechando=true;
    const img=v.querySelector(".vimg>img"),t0=img?.style.transform||"none",o0=v.style.opacity||1;
    img?.animate([{transform:t0},{transform:t0==="none"?"scale(.97)":t0+" translateY(40px)"}],{duration:160,easing:"ease-in",fill:"forwards"});
    v.animate([{opacity:o0},{opacity:0}],{duration:160,easing:"ease-in",fill:"forwards"}).onfinish=some;}
  addEventListener("keydown",e=>{if(v.hidden)return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")vai(idx-1,-1);else if(e.key==="ArrowRight")vai(idx+1,1);});
  v.addEventListener("click",e=>{if(e.target===v||e.target.classList.contains("vimg"))close();});
  return{open,close};
})();
// Rodada 8 · d3 B: "Lido do Drive há 5 min · Ler de novo ↻" na página do personagem (simulado até o Drive ser lido de verdade)
// Rodada 9 · d2 B: ao tocar, o texto vira "Lendo o Drive…" (giro pequeno) e depois "Lido do Drive agora mesmo"; com "reduzir movimento", sem giro
// Rodada 13 · d2 B: uma tarefa agendada lê o Drive às 7h nos dias úteis e republica o Vault; a frase mostra quando foi a última leitura
// (horário de Brasília). "Ler de novo" continua simulado; pedir no chat também vale.
function quandoLido(iso,reserva){const d=new Date(iso);if(!iso||isNaN(d))return reserva?`em ${reserva}`:"";
  const f=t=>Object.fromEntries(new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(t).map(x=>[x.type,x.value]));
  const a=f(d),hoje=f(new Date()),ontem=f(new Date(Date.now()-864e5)),dia=x=>x.day+"/"+x.month;
  const hora=a.minute==="00"?`${+a.hour}h`:`${a.hour}:${a.minute}`;
  return dia(a)===dia(hoje)?`hoje às ${hora}`:dia(a)===dia(ontem)?`ontem às ${hora}`:`em ${dia(a)} às ${hora}`;}
const LEITURA=ACERVO.leituraAuto?"nos dias úteis, sozinho às 7h":""; // só aparece quando a tarefa agendada existir (build.py LEITURA_AUTO)
let lidoHa=PLAN.real?quandoLido(PLAN.real.lidaEm,PLAN.real.lidaEmTexto):"há 5 min",lendo=false;
function lidoHTML(){return lendo?`<span class="fact lido" role="status"><span class="gira" aria-hidden="true"></span>Lendo o Drive…</span>`:`<span class="fact lido">Lido do Drive <b>${lidoHa}</b> · ${LEITURA?`${LEITURA} · `:""}<button class="plink" data-reler>Ler de novo ↻</button></span>`;}
// Rodada 16 · d1 C: a mesma leitura atualiza a página do personagem, a linha do menu da conta e a hora do painel de avisos
function leituraTxt(){return lidoHa==="agora mesmo"?"Leitura agora mesmo":`Leitura de ${lidoHa}`;}
function pintaLido(foco){const m=$("#who [data-lerpl]");if(m)m.innerHTML=lerItemHTML();const a=$("#avMenu [data-avlido]");if(a)a.textContent=leituraTxt();
  const f=document.querySelector("#page .fact.lido");if(!f)return;f.outerHTML=lidoHTML();if(foco)document.querySelector("#page [data-reler]")?.focus({preventScroll:true});}
function reler(){if(lendo)return;lendo=true;pintaLido();setTimeout(()=>{lendo=false;lidoHa="agora mesmo";pintaLido(!$("#page").hidden);},RM?300:1400);}
let tt=0;function toast(m){document.querySelector(".toast")?.remove();const t=el("div",{class:"toast",role:"status"});t.textContent=m;
  document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),2200);}

/* ================= ROTAS ================= */
// a página não é refeita se o personagem já está aberto (o Voltar da Rodada 11 · d3 B só fecha a imagem ampliada)
function route(){if(!session)return;const h=location.hash.slice(1);
  if(h.startsWith("p-")){const slug=h.slice(2);Viewer.close();if(Page.atual()!==slug||$("#page").hidden)Page.show(slug);}
  else{if(!$("#viewer").hidden)Viewer.close();Page.hide();}}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#page").hidden&&$("#viewer").hidden)location.hash="";});

// Versão para o GitHub Pages: sem a entrada simulada (nem validação de e-mail); abre direto no acervo
enter({nome:"Equipe Criação",email:"",grupo:"Criação",at:Date.now()});
})();
